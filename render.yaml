# Render Blueprint: one Docker web service — the Express API, the built client and the Python model service.
# Render dashboard > New > Blueprint > pick this repo; it asks for the sync: false values.
services:
  - type: web
    name: aura-screen
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DEMO_DOCTOR_EMAIL
        sync: false
      # seconds the demo station takes to "capture" before sending its sample to the model
      - key: DEMO_CAPTURE_SECONDS
        value: "12"
