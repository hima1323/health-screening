# Red-flag symptoms. DRAFT: list, wording, synonyms and regexes must be reviewed by a clinician and tested with users.
# A "yes" to any `urgent_items` entry -> URGENT (rule R01), whatever the sensors say.
# Item ids and question wording follow the triage starter kit.
# `synonyms` help the LLM map a free-text answer to an item (the user must still confirm it);
# `complaint_regex` maps an ED chief complaint to the item in the benchmarks (mimic_ed.py, yale.py) only; report the
# complaints that map to nothing.
version: v0.2
status: draft
reviewed_by: null
review_date: null
sources: [Manchester Triage System discriminators, NICE Clinical Knowledge Summaries red flags, ESI level 1-2 criteria]

urgent_items: [chest_pain, severe_breathlessness, fainting, stroke_signs, confusion, worst_headache, severe_bleeding,
               severe_allergy]

items:
  chest_pain:
    question: "Do you have chest pain, pressure or tightness right now, or did it start in the last few hours?"
    synonyms: [chest pain, chest tightness, chest pressure, heavy chest]
    complaint_regex: "chest (pain|tight|pressure)|\\bcp\\b|angina"
  severe_breathlessness:
    question: "Are you so short of breath that it is hard to speak in full sentences?"
    synonyms: [can't breathe, cannot breathe, gasping, breathless]
    complaint_regex: "\\bsob\\b|short(ness)? of breath|dyspn|resp(iratory)? distress|can't breathe|difficulty breathing"
  fainting:
    question: "Have you fainted or nearly fainted today?"
    synonyms: [passed out, blacked out, collapsed]
    complaint_regex: "syncope|faint|collapse|passed out|loss of consciousness|\\bloc\\b"
  stroke_signs:
    question: "Do you have sudden weakness, numbness, a drooping face or trouble speaking?"
    synonyms: [face drooping, slurred speech, arm weakness, numb on one side]
    complaint_regex: "stroke|\\bcva\\b|\\btia\\b|weakness|numb|facial droop|slurred|aphasia"
  confusion:
    question: "Do you (or does someone with you) notice new confusion or unusual drowsiness?"
    synonyms: [confused, disoriented, can't think straight]
    complaint_regex: "confus|altered mental|\\bams\\b|disorient|letharg|unresponsive"
  worst_headache:
    question: "Do you have a sudden, severe headache - the worst you have ever had?"
    synonyms: [worst headache, thunderclap headache]
    complaint_regex: "worst headache|thunderclap|severe headache"
  severe_bleeding:
    question: "Are you bleeding heavily or vomiting blood?"
    synonyms: [heavy bleeding, won't stop bleeding, vomiting blood]
    complaint_regex: "hemorrhag|haemorrhag|hematemesis|vomiting blood|heavy bleeding|\\bgi bleed"
  severe_allergy:
    question: "Do you have swelling of the face, lips or tongue, or a rash with difficulty breathing?"
    synonyms: [swollen lips, swollen tongue, face swelling, allergic reaction]
    complaint_regex: "anaphyla|angioedema|allergic reaction|lip swelling|tongue swelling"
  self_harm:              # handled by rule R02 (URGENT + crisis contacts), not by urgent_items
    question: "In the last two weeks, have you had thoughts that you would be better off dead, or of hurting yourself?"
    synonyms: [want to hurt myself, end my life, suicidal thoughts]
    complaint_regex: "suicid|\\bsi\\b|self[- ]?harm|overdose"
